name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Format, analyze, test, score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Auto-format (push only)
        if: github.event_name == 'push'
        run: |
          dart format .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "style: dart format"
            git push
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        if: always()
        run: |
          set +e
          dart analyze --format=machine --fatal-infos . > analysis.txt 2>&1
          code=$?
          cat analysis.txt
          awk -F'|' 'NF>=8 { lvl = ($1=="ERROR") ? "error" : "warning"; printf "::%s file=%s,line=%s,col=%s::%s %s: %s\n", lvl, $4, $5, $6, $1, $3, $8 }' analysis.txt | sed "s#file=$GITHUB_WORKSPACE/#file=#"
          exit $code

      - name: Run tests (VM)
        if: always()
        run: |
          set +e
          dart test --reporter=json > test-results.jsonl
          python3 .github/report_tests.py test-results.jsonl

      - name: Run tests (web)
        if: always()
        run: |
          set +e
          dart test --platform=chrome --reporter=json > test-results-web.jsonl
          python3 .github/report_tests.py test-results-web.jsonl

      - name: Run examples
        if: always()
        run: for f in example/*.dart; do echo "== $f"; dart run "$f" || exit 1; done

      - name: Pub dry run
        if: always()
        run: dart pub publish --dry-run

      - name: pana score
        if: always()
        run: |
          dart pub global activate pana
          set +e
          pana --no-warning --json . > pana.json
          set -e
          python3 - <<'PY'
          import json, os
          d = json.load(open('pana.json'))
          s = d.get('scores', {})
          print(f"::notice title=pana::{s.get('grantedPoints')}/{s.get('maxPoints')} points")
          out = open(os.environ['GITHUB_STEP_SUMMARY'], 'a')
          out.write(f"## pana: {s.get('grantedPoints')}/{s.get('maxPoints')}\n\n")
          for sec in d.get('report', {}).get('sections', []):
              print(f"::notice title={sec['title']}::{sec['grantedPoints']}/{sec['maxPoints']}")
              out.write(f"### {sec['title']} {sec['grantedPoints']}/{sec['maxPoints']}\n\n{sec.get('summary','')}\n\n")
              if sec['grantedPoints'] < sec['maxPoints']:
                  print(f"::warning title=pana {sec['title']}::" + sec.get('summary','').replace('\n', ' ')[:3000])
          PY
